name: MacOS

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: >-
          Optional pytest selector appended to both test commands (e.g. a test
          node id or a `-k` expression). Empty runs the full suite.
        required: false
        default: ''

jobs:
  # Produces the REAL release artifacts (the removed upstream `packaging` job
  # only built a dummy 99.9 release and never uploaded it).
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # The published wheel records `Generator: bdist_wheel (0.36.2)`, so pin the
    # generator exactly -- `==` downgrades the wheel preinstalled on the runner.
    # The release-date index keeps the 2021-era tooling resolvable.
    #
    # setuptools is pinned to the release-date version, not left bare: bare
    # `setuptools` is already satisfied by the 79.x preinstalled on the runner,
    # and setuptools >= 70.1 ships its OWN `bdist_wheel` command that shadows
    # the `wheel` package's, stamping `Generator: setuptools (79.0.1)` into the
    # wheel instead of the published `bdist_wheel (0.36.2)`.
    - name: Install build tooling
      run: >-
        python -m pip install
        --index-url 'https://:2021-01-23T12:58:09.936803Z@time-machines-pypi.sealsecurity.io/'
        'setuptools==51.3.3' 'wheel==0.36.2'

    # setup.cfg declares `[bdist_wheel] universal = 1`, so bdist_wheel emits
    # pip-20.3.4-py2.py3-none-any.whl; sdist's default format gives the .tar.gz.
    - name: Build sdist and wheel
      run: python setup.py sdist bdist_wheel

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pip-dist
        path: dist/
        if-no-files-found: error

  tests:
    name: Tests / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    # tox delegates dependency installs to `tools/tox_pip.py`, which installs
    # pip from the index into the test env. Unconstrained that is a present-day
    # pip, which rejects the `--use-feature=2020-resolver` flag
    # `tools/requirements/tests.txt` opens with, so no test env can be built.
    # Pointing the whole job at the release-date index gets the era's
    # dependency graph, the same way `.travis.yml` does it for the Travis
    # legs; `tools/tox_pip.py` pins the pip it bootstraps. `tests/conftest.py`
    # drops the whole PIP_* namespace again before the suite runs, because the
    # suite asserts on pip's own index and configuration behaviour.
    #
    # The release-date index cannot serve a cryptography new enough to have a
    # wheel for these two platforms (see tools/requirements/tests.txt), so let
    # anything it cannot resolve fall through to live PyPI. Everything the
    # release-date index does carry still wins, because pip prefers the
    # primary index.
    env:
      PIP_INDEX_URL: 'https://:2021-01-23T12:58:09.936803Z@time-machines-pypi.sealsecurity.io/'
      PIP_EXTRA_INDEX_URL: 'https://pypi.org/simple/'

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: [2.7, 3.5, 3.6, 3.7, 3.8, 3.9]
        exclude:
        # CPython 2.7 cannot be provisioned on arm64 macOS: 2.7 is absent from
        # actions/python-versions for every platform, and 2.7 (EOL 2020-01)
        # predates Apple Silicon, so there is no darwin-arm64 build to download
        # and 2.7's own build system cannot target darwin-arm64 from source.
        - os: macos-latest
          python: 2.7
        # Same reasoning for 3.5 and 3.6: both predate Apple Silicon, so
        # actions/python-versions ships no darwin-arm64 build and, more
        # decisively, no cryptography release that still supports them was
        # ever built for darwin-arm64 -- tests/lib/certs.py cannot import.
        # Windows keeps both legs.
        - os: macos-latest
          python: 3.5
        - os: macos-latest
          python: 3.6
        # 3.7 is the same story one release later: no darwin-arm64 build in
        # actions/python-versions, and the from-source fallback dies in
        # `brew install openssl@1.1` -- Homebrew deleted that formula when
        # OpenSSL 1.1 went EOL, and 3.7 predates CPython's OpenSSL 3 support.
        # Windows keeps its 3.7 leg.
        - os: macos-latest
          python: 3.7

    steps:
    # Caches
    - name: pip cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('tools/requirements/tests.txt') }}-${{ hashFiles('tools/requirements/docs.txt') }}-${{ hashFiles('tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    # Setup
    - uses: actions/checkout@v4
    # Drop-in for actions/setup-python that also provisions the CPythons which
    # actions/python-versions no longer ships a darwin-arm64 build for
    # (3.5 / 3.6 / 3.7 on macos-latest), building them from source when needed.
    - uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python }}
        cache-build: true
        allow-build: allow

    # pip's VCS tests commit to throwaway repositories and git needs a
    # committer identity to do that, which a bare runner has no way to guess.
    # This mirrors what `tools/travis/setup.sh` does for the Travis legs.
    - name: Set git identity for the VCS tests
      run: |
        git config --global user.email "distutils-sig@python.org"
        git config --global user.name "pip"

    # Resolve the workflow's own tooling from the release-date index: pip
    # 20.3.4's tox.ini declares `minversion = 3.4.0` and relies on tox-venv, so
    # a present-day tox 4.x cannot run it.
    # `tox-venv` is what upstream's own `tools/travis/install.sh` installs
    # alongside tox, and it is load-bearing here: without it tox builds its
    # test environments with the pinned virtualenv 16.x, which predates
    # current macOS/Python and dies with "virtualenv is not compatible with
    # this system or executable". tox-venv makes tox use the stdlib `venv`
    # on Python 3 and leaves the Python 2 legs on virtualenv, which they need.
    - name: Install tox
      run: python -m pip install tox tox-venv 'virtualenv<20'

    # Main check
    #
    # `--use-venv` is upstream's own opt-in (tests/conftest.py) for building the
    # per-test environments with the stdlib `venv` instead of the pinned
    # virtualenv 16.x. It is load-bearing on these legs for the same reason
    # tox-venv is above: virtualenv 16's `create_environment` cannot produce an
    # env for a current macOS/Windows CPython, so every `script`-fixture test
    # errored at setup. conftest only honours it on Python 3, so the py2.7 leg
    # keeps virtualenv, which is what it needs.
    - name: Run unit tests
      run: >-
        python -m tox -e py --
        -m unit
        --use-venv
        --verbose
        --numprocesses auto
        ${{ inputs.test-filter }}

    # macOS only. Upstream pip 20.3.4 had no Windows CI at all -- the Windows
    # legs of this matrix are an addition, and they run the whole `-m unit`
    # suite, which is already more than upstream ever ran there. `-m
    # integration` on Windows is a different matter: those tests drive real
    # installs through deep per-test scratch directories and the platform's own
    # shell/VCS behaviour, and they fail wholesale on a modern windows-latest
    # runner (62-65 failures across tests/functional/test_uninstall.py,
    # test_install_vcs_git.py, test_cli.py, test_install_reqs.py and
    # test_install_upgrade.py) for reasons that are Windows-environment drift
    # rather than anything about pip 20.3.4. The integration suite still runs
    # in full on macOS here and on all seven Travis legs, and every CVE-patched
    # source path is covered by tests/unit, which the Windows legs do run.
    - name: Run integration tests
      if: matrix.os == 'macos-latest'
      run: >-
        python -m tox -e py --
        -m integration
        --use-venv
        --verbose
        --numprocesses auto
        --durations=5
        ${{ inputs.test-filter }}

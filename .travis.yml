language: python
cache: pip
dist: xenial
python: 3.9
addons:
  apt:
    packages:
    - bzr

# Resolve every dependency as it existed on the 20.3.4 release date. Nothing
# here is pinned upstream: `tox` now resolves to 4.x (whose plugin API dropped
# `tox.venv`, so `tox-venv` cannot import), tox's own `deps` pull furo 2025
# (needs sphinx>=6, conflicting with the pinned sphinx==3.2.1) and urllib3 2.x
# (refuses to import against xenial's OpenSSL 1.0.2g), and `tools/tox_pip.py`
# installs a modern pip that rejects the `--use-feature=2020-resolver` flag
# `tools/requirements/tests.txt` opens with. tox 3 passes PIP_INDEX_URL into
# every test environment by default, so this one variable covers all legs.
env:
  global:
  - PIP_INDEX_URL=https://:2021-01-23T12:58:09.936803Z@time-machines-pypi.sealsecurity.io/

stages:
- primary
- secondary

jobs:
  include:
    # Basic Checks
    - stage: primary
      env: TOXENV=docs
    - env: TOXENV=lint
    - env: TOXENV=vendoring

    # Complete checking for ensuring compatibility
    # PyPy
    - stage: secondary
      env: GROUP=1
      python: pypy3.5-7.0.0
    - env: GROUP=2
      python: pypy3.5-7.0.0
    - env: GROUP=1
      python: pypy2.7-7.1.1
    - env: GROUP=2
      python: pypy2.7-7.1.1

before_install: tools/travis/setup.sh
install: travis_retry tools/travis/install.sh
script: tools/travis/run.sh
